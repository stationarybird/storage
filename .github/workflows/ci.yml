name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false # Standard-library-only module; no go.sum to cache against.
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
